# 工作任务台 · Supabase 免费版保活
# 作用：每天自动访问一次数据库，避免免费项目因“7 天无活动”被暂停。
# 说明：用你已有的 GitHub 账号运行，不新增任何账号、零成本。
name: Keep Supabase Alive

on:
  schedule:
    - cron: '17 3 * * *'      # 每天 UTC 03:17 访问一次（约等于北京时间 11:17）
  workflow_dispatch: {}        # 也可在 Actions 页面手动“Run workflow”触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/tasks?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
