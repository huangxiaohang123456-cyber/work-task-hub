name: Keepalive

# 防止 Supabase 免费项目因「约 7 天无数据库访问」被自动暂停。
# 每天定时向数据库发一次请求（保留在此仓库的 Secrets 中：SUPABASE_URL / SUPABASE_ANON_KEY）。
# 日常打开 App 使用本身也会访问数据库，本任务只是长期无人使用时的兜底。
on:
  schedule:
    - cron: '23 3 * * *'   # 每天 UTC 03:23（北京时间约 11:23）
  workflow_dispatch: {}    # 可手动在 Actions 页面点击运行

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase（保持项目活跃）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "未配置 SUPABASE_URL / SUPABASE_ANON_KEY，跳过保活。"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/tasks?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase ping 返回 HTTP $CODE"
