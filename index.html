<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2e6b4f" />
  <title>工作任务台</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div id="app">

    <!-- ===== 主应用 视图（本地版：无需登录，打开即用） ===== -->
    <section id="main-view" class="main-view">
      <header class="topbar">
        <div class="topbar-left">
          <span class="logo">📋 工作任务台</span>
        </div>
        <div class="topbar-right">
          <span id="user-name" class="user-name"></span>
          <button class="btn btn-ghost" id="btn-settings">我的</button>
        </div>
      </header>

      <div id="reminder-banner" class="reminder-banner hidden"></div>

      <div class="toolbar">
        <button class="btn btn-primary" id="btn-add">＋ 添加任务</button>
        <button class="btn btn-ghost" id="btn-stats">📊 统计</button>
        <button class="btn btn-ghost" id="btn-export">⬇ 导出Excel</button>
        <button class="btn btn-ghost" id="btn-push">🔔 推送到微信</button>

        <div class="filters">
          <select id="filter-status">
            <option value="">全部状态</option>
            <option value="todo">待办</option>
            <option value="doing">进行中</option>
            <option value="done">已完成</option>
          </select>
          <select id="filter-priority">
            <option value="">全部优先级</option>
            <option value="high">高</option>
            <option value="medium">中</option>
            <option value="low">低</option>
          </select>
          <select id="filter-recurrence">
            <option value="">全部周期</option>
            <option value="none">一次性</option>
            <option value="daily">每天</option>
            <option value="weekly">每周</option>
            <option value="monthly">每月</option>
          </select>
          <input type="search" id="filter-search" placeholder="搜索标题 / 标签" />
        </div>
      </div>

      <ul id="task-list" class="task-list"></ul>
      <p id="empty-hint" class="empty-hint hidden">还没有任务，点“＋ 添加任务”开始吧。</p>
    </section>
  </div>

  <!-- ===== 添加/编辑 任务弹窗 ===== -->
  <div id="task-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="task-modal-title">添加任务</h2>
        <button class="modal-close" data-close>×</button>
      </div>
      <form id="task-form">
        <input type="hidden" id="task-id" />
        <label>标题 *
          <input type="text" id="f-title" required maxlength="120" placeholder="例如：提交本周周报" />
        </label>
        <label>描述
          <textarea id="f-desc" rows="3" placeholder="补充说明（可选）"></textarea>
        </label>
        <div class="row">
          <label>优先级
            <select id="f-priority">
              <option value="high">高</option>
              <option value="medium" selected>中</option>
              <option value="low">低</option>
            </select>
          </label>
          <label>状态
            <select id="f-status">
              <option value="todo" selected>待办</option>
              <option value="doing">进行中</option>
              <option value="done">已完成</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label>截止日期
            <input type="datetime-local" id="f-due" />
          </label>
          <label>周期
            <select id="f-recurrence">
              <option value="none" selected>一次性</option>
              <option value="daily">每天</option>
              <option value="weekly">每周</option>
              <option value="monthly">每月</option>
            </select>
          </label>
        </div>
        <label>标签（用逗号分隔）
          <input type="text" id="f-tags" placeholder="如：汇报, 项目A" />
        </label>
        <p id="task-form-msg" class="form-msg"></p>
        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" data-close>取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== 统计 弹窗 ===== -->
  <div id="stats-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>完成统计</h2>
        <button class="modal-close" data-close>×</button>
      </div>
      <div id="stats-summary" class="stats-summary"></div>
      <canvas id="stats-chart" height="220"></canvas>
    </div>
  </div>

  <!-- ===== 我的设置 弹窗（显示名 + 微信推送，均存本机） ===== -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>我的设置</h2>
        <button class="modal-close" data-close>×</button>
      </div>
      <form id="settings-form">
        <label>我的名字（显示为该任务的添加人）
          <input type="text" id="s-name" placeholder="如：阚斌" />
        </label>
        <label>微信推送令牌 (PushPlus)
          <input type="text" id="s-token" placeholder="在 pushplus.plus 获取的 token（留空则不推送）" />
        </label>
        <label>提前提醒小时数
          <input type="number" id="s-lead" min="1" max="720" value="24" />
        </label>
        <p class="form-hint">设置 PushPlus 令牌后，点顶部“🔔 推送到微信”可把临期/逾期任务发到你的微信。</p>
        <p id="cp-msg" class="form-msg"></p>
        <div class="modal-foot">
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 第三方库（UMD 全局） -->
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <!-- 应用配置与逻辑 -->
  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
