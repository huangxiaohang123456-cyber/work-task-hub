<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f2802f" />
  <title>工作任务台</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div id="app">

    <!-- 顶部标题栏 -->
    <header class="app-header">
      <span class="app-title">📋 工作任务台</span>
      <span id="me-display" class="me-display"></span>
    </header>

    <main class="pages">

      <!-- ============ 任务页 ============ -->
      <section id="page-tasks" class="page active">
        <div class="stat-cards">
          <div class="stat-card"><div class="num" id="sc-todo">0</div><div class="lbl">待办</div></div>
          <div class="stat-card doing"><div class="num" id="sc-doing">0</div><div class="lbl">进行中</div></div>
          <div class="stat-card done"><div class="num" id="sc-done">0</div><div class="lbl">已完成</div></div>
          <div class="stat-card over"><div class="num" id="sc-over">0</div><div class="lbl">逾期</div></div>
        </div>

        <div class="segmented" id="view-seg">
          <button class="active" data-view="all">全部</button>
          <button data-view="today">今天</button>
          <button data-view="week">本周</button>
          <button data-view="month">本月</button>
          <button data-view="overdue">逾期</button>
          <button data-view="none">无期限</button>
        </div>

        <div class="tool-row">
          <select id="filter-priority">
            <option value="">全部优先级</option>
            <option value="high">高</option>
            <option value="medium">中</option>
            <option value="low">低</option>
          </select>
          <input type="search" id="filter-search" placeholder="搜索标题 / 标签" />
          <button class="btn-ghost sm" id="btn-export">⬇ 导出</button>
        </div>

        <ul id="task-list" class="task-list"></ul>
        <p id="empty-hint" class="empty-hint hidden">还没有任务，点右下角 ＋ 添加</p>

        <div id="reminder-banner" class="reminder-banner hidden"></div>
      </section>

      <!-- ============ 统计页 ============ -->
      <section id="page-stats" class="page">
        <div class="stat-cards">
          <div class="stat-card"><div class="num" id="st-total">0</div><div class="lbl">总数</div></div>
          <div class="stat-card done"><div class="num" id="st-done">0</div><div class="lbl">已完成</div></div>
          <div class="stat-card"><div class="num" id="st-rate">0%</div><div class="lbl">完成率</div></div>
          <div class="stat-card over"><div class="num" id="st-over">0</div><div class="lbl">逾期</div></div>
        </div>

        <div class="panel">
          <h3 class="panel-title">按优先级</h3>
          <div id="dist-priority" class="bars"></div>
          <h3 class="panel-title">按状态</h3>
          <div id="dist-status" class="bars"></div>
        </div>

        <div class="panel">
          <h3 class="panel-title">完成趋势（近 8 周）</h3>
          <div id="trend" class="trend"></div>
        </div>
      </section>

      <!-- ============ 提醒页 ============ -->
      <section id="page-remind" class="page">
        <div class="panel">
          <h3 class="panel-title">📌 待办提醒</h3>
          <p class="hint">逾期任务标红，临近任务（提前 <span id="rem-lead">24</span> 小时）标橙。点下方按钮可一键推送到微信。</p>
          <div id="remind-list" class="remind-list"></div>
          <button class="btn-primary block" id="btn-push">🔔 推送到微信</button>
        </div>
      </section>

      <!-- ============ 我的页 ============ -->
      <section id="page-me" class="page">
        <div class="panel">
          <h3 class="panel-title">我的</h3>
          <label>我的名字（用于标注“添加人”）
            <input type="text" id="me-name" placeholder="如：阚斌" />
          </label>
          <label>微信推送令牌 (PushPlus)
            <input type="text" id="me-token" placeholder="在 pushplus.plus 获取的 token（留空则不推送）" />
          </label>
          <label>提前提醒小时数
            <input type="number" id="me-lead" min="1" max="720" value="24" />
          </label>
          <button class="btn-primary block" id="btn-save-me">保存</button>
          <p class="hint">数据存于云端，团队成员打开同一网址即可共享查看与编辑。本页名字仅用于标注添加人，不做登录。</p>
        </div>
      </section>

    </main>

    <!-- 底部 Tab 栏 -->
    <nav class="tabbar">
      <button class="tab active" data-page="tasks"><span class="ico">📋</span><span>任务</span></button>
      <button class="tab" data-page="stats"><span class="ico">📊</span><span>统计</span></button>
      <button class="tab" data-page="remind"><span class="ico">🔔</span><span>提醒</span></button>
      <button class="tab" data-page="me"><span class="ico">👤</span><span>我的</span></button>
    </nav>

    <!-- 悬浮添加按钮 -->
    <button id="fab" class="fab" title="添加任务">＋</button>

    <!-- ===== 添加/编辑 任务弹窗 ===== -->
    <div id="task-modal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-head">
          <h2 id="task-modal-title">添加任务</h2>
          <button class="modal-close" data-close>×</button>
        </div>
        <form id="task-form">
          <input type="hidden" id="task-id" />
          <label>标题 *
            <input type="text" id="f-title" required maxlength="120" placeholder="例如：提交本周周报" />
          </label>
          <label>描述
            <textarea id="f-desc" rows="3" placeholder="补充说明（可选）"></textarea>
          </label>
          <div class="row">
            <label>优先级
              <select id="f-priority">
                <option value="high">高</option>
                <option value="medium" selected>中</option>
                <option value="low">低</option>
              </select>
            </label>
            <label>状态
              <select id="f-status">
                <option value="todo" selected>待办</option>
                <option value="doing">进行中</option>
                <option value="done">已完成</option>
              </select>
            </label>
          </div>
          <div class="row">
            <label>截止日期
              <input type="datetime-local" id="f-due" />
            </label>
            <label>周期
              <select id="f-recurrence">
                <option value="none" selected>一次性</option>
                <option value="daily">每天</option>
                <option value="weekly">每周</option>
                <option value="monthly">每月</option>
              </select>
            </label>
          </div>
          <label>标签（用逗号分隔）
            <input type="text" id="f-tags" placeholder="如：汇报, 项目A" />
          </label>
          <p id="task-form-msg" class="form-msg"></p>
          <div class="modal-foot">
            <button type="button" class="btn-ghost" data-close>取消</button>
            <button type="submit" class="btn-primary">保存</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 应用逻辑（零外部依赖） -->
    <script src="assets/config.js"></script>
    <script src="assets/app.js"></script>
  </div>
</body>
</html>
